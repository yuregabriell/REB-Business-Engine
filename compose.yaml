services:
  reb:
    build: .
    restart: unless-stopped
    environment:
      REB_PUBLIC_URL: ${REB_PUBLIC_URL:?set_https_public_url}
      REB_REMOTE_DATA: /data
      REB_REMOTE_ALLOW_EXTERNAL: "0"
    volumes:
      - reb_data:/data
    expose:
      - "8787"
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8787/healthz',timeout=3)"]
      interval: 20s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      REB_DOMAIN: ${REB_DOMAIN:?set_domain}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [reb]
    networks: [private]
volumes:
  reb_data:
  caddy_data:
  caddy_config:
networks:
  private:
